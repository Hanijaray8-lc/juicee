<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups" />
  <!-- Single correct viewport: covers notch, prevents zoom, works on all screen sizes -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />

  <meta name="description" content="Chat Fresh. Catch the Vibe. Make Every Moment Juicy." />
  <link rel="icon" href="%PUBLIC_URL%/ic_notification.png" />
  <title>Juicy</title>
  <script>
    if (typeof window !== 'undefined') {
      if (!window.global) {
        window.global = window;
      }
      if (!window.process) {
        window.process = {};
      }
      if (!window.process.env) {
        window.process.env = { NODE_ENV: 'development' };
      }
      window.process.browser = true;
      if (typeof window.process.nextTick !== 'function') {
        window.process.nextTick = function (cb) {
          var args = Array.prototype.slice.call(arguments, 1);
          if (typeof queueMicrotask === 'function') {
            queueMicrotask(function () { cb.apply(null, args); });
          } else {
            Promise.resolve().then(function () { cb.apply(null, args); });
          }
        };
      }
    }
  </script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

</body>

</html>
